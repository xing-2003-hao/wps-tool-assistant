<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>单工具点检</title>
<style>body{font-family:Consolas,monospace;font-size:13px}pre{white-space:pre-wrap}</style></head>
<body>
<iframe id="fr" src="/panel.html" style="width:380px;height:900px;border:1px solid #ddd"></iframe>
<pre id="log"></pre>
<script>
var logEl = document.getElementById('log');
function log(s) { logEl.textContent += s + '\n'; }
var key = new URLSearchParams(location.search).get('key') || 'doc-outline';

var insertedPics = [], createdDocs = [], findCalls = [];
function mkShape() { return { Width: 800, LockAspectRatio: 0 }; }
function mkInlineShapes() { return { AddPicture: function (p) { insertedPics.push(p); return mkShape(); } }; }
window.wps = { WpsApplication: function () { return window.__app; } };
window.__app = {
  ActiveDocument: {
    Name: '测试.docx',
    Content: {
      Find: { ClearFormatting: function () { }, Replacement: { ClearFormatting: function () { } }, Execute: function (find, mc, a, b, c, e, f, w, fmt, rep, rpl) { findCalls.push([find, rep]); return true; } },
      InlineShapes: mkInlineShapes()
    },
    InlineShapes: mkInlineShapes(),
    Shapes: { AddPicture: function (p) { insertedPics.push(p); return mkShape(); } },
    Paragraphs: { Item: function () { return { Range: { Text: '' } }; } }
  },
  Selection: { Type: 2, Text: '', InlineShapes: mkInlineShapes(), InsertAfter: function () { }, Collapse: function () { } },
  Documents: { Add: function () { var d = { Name: '新文档' + createdDocs.length, Content: window.__app.ActiveDocument.Content, Paragraphs: window.__app.ActiveDocument.Paragraphs }; createdDocs.push(d); return d; } }
};

var FILLS = {
  'doc-outline': { 'ol-text': '总经理\n  技术部\n    前端组', 'ol-title': '测试架构' },
  'doc-mindmap': { 'mm-text': '中心主题\n  分支一\n  分支二', 'mm-title': '测试导图' },
  'doc-seatcard': { 'sc-names': '张三\n李四', 'sc-size': '72', 'sc-font': '微软雅黑' },
  'doc-thousand': { 'kt-text': '测试文本内容测试文本内容测试文本内容', 'kt-title': '测试' },
  'doc-video-nowm': { 'vn-text': '复制打开抖音 https://v.douyin.com/abc123/', 'vn-api': '' },
  'word-replace': { 'wr-rules': '2023=>2024\n张三=>李四' }
};

document.getElementById('fr').onload = function () {
  var w = this.contentWindow, d = this.contentDocument;
  setTimeout(function () {
    try {
      log('== 点检 ' + key + ' == host: ' + w.WTA_HOST().type);
      w.WTA_LLM.chatStream = function (messages, onDelta) {
        var full = '测试模型输出。';
        try { onDelta(full, full); } catch (e) { }
        return Promise.resolve(full);
      };
      w.prompt = function () { return null; };   // WPS webview 行为：prompt 不可用
      if (w.TK) {
        w.TK.save = function (blob, name) { return Promise.resolve('C:\\fake\\' + (name || 'out.png')); };
        w.TK.resultBox = function () { };
        w.TK.ping = function () { return Promise.resolve(true); };   // 测试环境没有 /ping
      }
      var card = d.querySelector('.tool-card[data-key="' + key + '"]');
      if (!card) { log('FAIL 找不到卡片 ' + key); log('=== DONE ==='); return; }
      card.onclick();
      log('点击后 status: ' + d.getElementById('status').textContent);

      // 找「弹出中」的 modal（.show）
      var mask = d.querySelector('.tk-mask.show, [class*="tk"][class*="show"]');
      var anyInput = d.querySelector('#ol-text,#mm-text,#sc-names,#kt-text,#vn-text,#wr-rules');
      if (mask && anyInput && anyInput.offsetParent !== null) {
        log('modal: 打开（含输入框）');
        var fills = FILLS[key] || {};
        Object.keys(fills).forEach(function (id) { var el = d.getElementById(id); if (el) el.value = fills[id]; });
        var runBtn = mask.querySelector('.tk-run');
        if (runBtn && runBtn.style.display !== 'none') {
          runBtn.click();
          setTimeout(function () {
            log('运行后 status: ' + d.getElementById('status').textContent);
            log('插图: ' + insertedPics.length + ' 新建文档: ' + createdDocs.length
              + (findCalls.length ? ' Find.Execute: ' + JSON.stringify(findCalls) : ''));
            log('=== DONE ===');
          }, 1200);
          return;
        }
        log('modal 打开但没找到运行按钮');
      } else {
        log('modal: 无（工具不弹窗）');
      }
      setTimeout(function () {
        log('2 秒后 status: ' + d.getElementById('status').textContent);
        log('插图: ' + insertedPics.length + ' 新建文档: ' + createdDocs.length);
        log('=== DONE ===');
      }, 1500);
    } catch (e) { log('TEST ERROR ' + e.message); log('=== DONE ==='); }
  }, 1400);
};
</script>
</body></html>
